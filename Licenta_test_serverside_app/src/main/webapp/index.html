<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Server Login</title>
    <style>
        :root {
            --gh-bg: #f6f8fa;
            --gh-border: #d0d7de;
            --gh-text: #24292f;
            --gh-text-muted: #57606a;
            --gh-green: #2da44e;
            --gh-green-hover: #2c974b;
            --gh-focus: #0969da;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background: var(--gh-bg);
            color: var(--gh-text);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-wrapper {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-placeholder {
            font-size: 48px;
            margin-bottom: 24px;
        }
        .login-box {
            background: white;
            padding: 24px;
            border-radius: 6px;
            border: 1px solid var(--gh-border);
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 3px 6px rgba(140,149,159,0.15);
        }
        .login-box h2 {
            margin-top: 0;
            font-weight: 300;
            font-size: 24px;
            text-align: center;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .login-box p.subtitle {
            color: var(--gh-text-muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .login-box input {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid var(--gh-border);
            border-radius: 6px;
            box-sizing: border-box;
            background-color: var(--gh-bg);
            transition: 80ms cubic-bezier(0.33, 1, 0.68, 1);
            transition-property: color,background-color,box-shadow,border-color;
        }
        .login-box input:focus {
            outline: none;
            border-color: var(--gh-focus);
            box-shadow: inset 0 0 0 1px var(--gh-focus);
            background-color: white;
        }
        .login-box button {
            background: var(--gh-green);
            color: white;
            width: 100%;
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid rgba(27,31,36,0.15);
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s cubic-bezier(0.3, 0, 0.5, 1);
        }
        .login-box button:hover {
            background: var(--gh-green-hover);
        }
        #loginError {
            color: #cf222e;
            display: none;
            font-size: 13px;
            margin-top: 15px;
            padding: 8px;
            background: #ffebe9;
            border: 1px solid #ff818266;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="logo-placeholder">🖥️</div>
    <div class="login-box">
        <h2>Sign in to System</h2>
        <p class="subtitle">Access the administration panel</p>
        <div class="input-group">
            <input type="password" id="adminPasswordInput" placeholder="Server Password" onkeydown="if(event.key === 'Enter') attemptLogin()">
        </div>
        <button onclick="attemptLogin()">Sign in</button>
        <div id="loginError">Incorrect password. Please try again.</div>
    </div>
</div>

<script>
    // If they are already logged in, send them straight to the dashboard!
    if (localStorage.getItem('adminAuth') === 'true') {
        window.location.href = 'dashboard.html';
    }

    const authUrl = 'https://demo-adding-drugs-strategy.trycloudflare.com/Licenta_test_serverside_app-1.0-SNAPSHOT/api/auth/login';

    function attemptLogin() {
        const pass = document.getElementById('adminPasswordInput').value;
        const errorText = document.getElementById('loginError');

        fetch(authUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: pass
        })
            .then(res => {
                if (res.ok) {
                    // Success! Save the token and redirect to the dashboard
                    localStorage.setItem('adminAuth', 'true');
                    window.location.href = 'dashboard.html';
                } else {
                    // Failure
                    errorText.style.display = 'block';
                    document.getElementById('adminPasswordInput').value = '';
                }
            })
            .catch(err => alert("Server offline or unreachable."));
    }
</script>
</body>
</html>
