<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PC Hardware Configurations</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<h2>Connected PC Configurations</h2>

<table id="configTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Hostname</th>
        <th>CPU Model</th>
        <th>RAM (GB)</th>
        <th>Storage</th>
        <th>Graphics Cards</th>
        <th>OS Version</th>
        <!-- <th>Network</th> -->
        <th>Installed Antivirus Soft.</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
    fetch('/Licenta_test_serverside_app-1.0-SNAPSHOT/api/configs')
        .then(response => response.json())
        .then(data => {
            const tbody = document.querySelector('#configTable tbody');
            data.forEach(pc => {
                const row = `<tr>
                        <td>${pc.id}</td>
                        <td>${pc.hostname}</td>
                        <td>${pc.cpuModel}</td>
                        <td>${pc.ramGb}</td>
                        <td>${pc.storage}</td>
                        <td>${pc.graphicsCards}</td>
                        <td>${pc.osVersion}</td>
                        <!--<td>${pc.network}</td> -->
                        <td>${pc.antivirus}</td>
                    </tr>`;
                tbody.innerHTML += row;
            });
        })
        .catch(error => console.error('Error fetching data:', error));
</script>
</body>
</html>
