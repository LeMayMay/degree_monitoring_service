<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PC Hardware Configurations</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-container { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; margin-bottom: 20px; }
        .form-container input { margin-bottom: 10px; padding: 5px; width: 200px; }
        .form-container button { padding: 5px 15px; cursor: pointer; }
        button { cursor: pointer; padding: 4px 8px; margin-right: 5px; }
    </style>
</head>
<body>

<h2>PC Configurations Management</h2>

<!-- CREATE / UPDATE FORM -->
<div class="form-container">
    <h3 id="formTitle">Add New PC Configuration</h3>
    <form id="pcForm">
        <!-- Hidden ID field to keep track of which item we are updating -->
        <input type="hidden" id="pcId">

        <input type="text" id="hostname" placeholder="Hostname" required>
        <input type="text" id="cpuModel" placeholder="CPU Model" required>
        <input type="number" id="ramGb" placeholder="RAM (GB)" required>
        <input type="text" id="storage" placeholder="Storage" required>
        <input type="text" id="graphicsCards" placeholder="Graphics Cards">
        <input type="text" id="osVersion" placeholder="OS Version" required>
        <input type="text" id="antivirus" placeholder="Antivirus">

        <br>
        <button type="submit" id="saveBtn">Save Configuration</button>
        <button type="button" onclick="resetForm()">Cancel</button>
    </form>
</div>

<!-- DATA TABLE -->
<table id="configTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Hostname</th>
        <th>CPU Model</th>
        <th>RAM (GB)</th>
        <th>Storage</th>
        <th>Graphics Cards</th>
        <th>OS Version</th>
        <th>Installed Antivirus</th>
        <th>Actions</th> <!-- New Actions Column -->
    </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
    const apiUrl = '/Licenta_test_serverside_app-1.0-SNAPSHOT/api/configs';
    let pcData = []; // Store the data globally so we can access it for editing

    // 1. READ: Fetch and display the data
    function loadConfigs() {
        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                pcData = data;
                renderTable();
            })
            .catch(error => console.error('Error fetching data:', error));
    }

    function renderTable() {
        const tbody = document.querySelector('#configTable tbody');
        tbody.innerHTML = ''; // Clear existing rows

        pcData.forEach(pc => {
            const row = `<tr>
                    <td>${pc.id || ''}</td>
                    <td>${pc.hostname}</td>
                    <td>${pc.cpuModel}</td>
                    <td>${pc.ramGb}</td>
                    <td>${pc.storage}</td>
                    <td>${pc.graphicsCards}</td>
                    <td>${pc.osVersion}</td>
                    <td>${pc.antivirus}</td>
                    <td>
                        <button onclick="editPc(${pc.id})">Edit</button>
                        <button onclick="deletePc(${pc.id})" style="color: red;">Delete</button>
                    </td>
                </tr>`;
            tbody.insertAdjacentHTML('beforeend', row);
        });
    }

    // 2. CREATE & UPDATE: Handle form submission
    document.getElementById('pcForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent page reload

        const id = document.getElementById('pcId').value;
        const method = id ? 'PUT' : 'POST'; // If ID exists, it's an Update. Otherwise, Create.
        const targetUrl = id ? `${apiUrl}/${id}` : apiUrl;

        const payload = {
            hostname: document.getElementById('hostname').value,
            cpuModel: document.getElementById('cpuModel').value,
            ramGb: parseInt(document.getElementById('ramGb').value),
            storage: document.getElementById('storage').value,
            graphicsCards: document.getElementById('graphicsCards').value,
            osVersion: document.getElementById('osVersion').value,
            antivirus: document.getElementById('antivirus').value
        };

        // Add ID to payload if updating
        if (id) payload.id = parseInt(id);

        fetch(targetUrl, {
            method: method,
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
            .then(response => {
                if (response.ok) {
                    resetForm();
                    loadConfigs(); // Refresh the table
                } else {
                    console.error('Failed to save configuration');
                }
            })
            .catch(error => console.error('Error saving data:', error));
    });

    // Populate form with existing data for Update
    function editPc(id) {
        const pc = pcData.find(item => item.id === id);
        if (!pc) return;

        document.getElementById('formTitle').innerText = "Edit PC Configuration";
        document.getElementById('pcId').value = pc.id;
        document.getElementById('hostname').value = pc.hostname;
        document.getElementById('cpuModel').value = pc.cpuModel;
        document.getElementById('ramGb').value = pc.ramGb;
        document.getElementById('storage').value = pc.storage;
        document.getElementById('graphicsCards').value = pc.graphicsCards;
        document.getElementById('osVersion').value = pc.osVersion;
        document.getElementById('antivirus').value = pc.antivirus;
    }

    // 3. DELETE: Remove a configuration
    function deletePc(id) {
        if (!confirm('Are you sure you want to delete this configuration?')) return;

        fetch(`${apiUrl}/${id}`, {
            method: 'DELETE'
        })
            .then(response => {
                if (response.ok) {
                    loadConfigs(); // Refresh the table after deletion
                } else {
                    console.error('Failed to delete configuration');
                }
            })
            .catch(error => console.error('Error deleting data:', error));
    }

    // Helper to clear the form
    function resetForm() {
        document.getElementById('pcForm').reset();
        document.getElementById('pcId').value = '';
        document.getElementById('formTitle').innerText = "Add New PC Configuration";
    }

    // Initial load
    loadConfigs();
</script>
</body>
</html>
