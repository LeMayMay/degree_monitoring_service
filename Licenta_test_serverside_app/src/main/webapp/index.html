<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Server Login</title>
    <style>
        body {
            font-family: Arial, sans-serif; background: #1e1e1e; height: 100vh;
            margin: 0; display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 350px;
        }
        .login-box input {
            width: 90%; padding: 12px; margin-top: 15px; margin-bottom: 20px;
            font-size: 1.1em; border: 1px solid #ccc; border-radius: 4px; text-align: center; letter-spacing: 2px;
        }
        .login-box button {
            background: #4CAF50; color: white; width: 100%; padding: 12px;
            font-size: 1.1em; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;
        }
        .login-box button:hover { background: #45a049; }
    </style>
</head>
<body>

<div class="login-box">
    <h2 style="margin-top:0;">🔒 System Access</h2>
    <p style="color: #666; font-size: 0.9em;">Enter the unique server password to access the administration panel.</p>
    <input type="password" id="adminPasswordInput" placeholder="Password" onkeydown="if(event.key === 'Enter') attemptLogin()">
    <button onclick="attemptLogin()">Login</button>
    <p id="loginError" style="color: red; display: none; font-size: 0.9em; margin-top: 15px;">Invalid password.</p>
</div>

<script>
    // If they are already logged in, send them straight to the dashboard!
    if (localStorage.getItem('adminAuth') === 'true') {
        window.location.href = 'dashboard.html';
    }

    const authUrl = '/Licenta_test_serverside_app-1.0-SNAPSHOT/api/auth/login';

    function attemptLogin() {
        const pass = document.getElementById('adminPasswordInput').value;
        const errorText = document.getElementById('loginError');

        fetch(authUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: pass
        })
            .then(res => {
                if (res.ok) {
                    // Success! Save the token and redirect to the dashboard
                    localStorage.setItem('adminAuth', 'true');
                    window.location.href = 'dashboard.html';
                } else {
                    // Failure
                    errorText.style.display = 'block';
                    document.getElementById('adminPasswordInput').value = '';
                }
            })
            .catch(err => alert("Server offline or unreachable."));
    }
</script>
</body>
</html>
